@if(job) {
  <div class="rating">
    @for (ratingId of ratingArr; track ratingId; let i = $index) {
      <button mat-icon-button  [id]="'star_'+i" (click)="updateJobRating(job, i+1)" [matTooltip]="ratingId+1+''" matTooltipPosition="above">
        <mat-icon color="accent">
          {{showIcon(i)}}
        </mat-icon>
      </button>
    }

  </div>
}
